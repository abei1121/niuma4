[package]
name = "system_keeper_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
sysinfo = "0.30"
nix = { version = "0.27", features = ["process", "signal"] }
